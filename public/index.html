  <style>
    :root {
      --bg-canvas: #F8FAFC;
      --surface: #FFFFFF;
      --border: #E6E8F0;
      --ink: #111827;
      --muted: #6B7280;
      --indigo: #0D9488;
      --teal-dark: #0F766E;
      --teal-soft: #F0FDFA;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(1200px 520px at 50% -80px, #CCFBF1 0%, #F8FAFC 60%);
      color: var(--ink);
      min-height: 100vh;
    }
    .tw-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(13, 148, 136, 0.06);
    }
    .tw-card-sm {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .tw-underline {
      position: relative;
      display: inline-block;
    }
    .tw-underline::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 2px;
      height: 8px;
      background: rgba(20, 184, 166, 0.26);
      border-radius: 999px;
      z-index: -1;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.2;
    }
    .btn-primary {
      background: var(--indigo);
      color: #fff;
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .btn-primary:hover { background: var(--teal-dark); }
    .btn-secondary {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .btn-secondary:hover { background: #F9FAFB; border-color: #D1D5DB; }
    .nav-pill {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      color: #4B5563;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .nav-pill:hover { background: #F0FDFA; color: var(--teal-dark); }
    .nav-pill.active { background: var(--teal-soft); color: var(--teal-dark); font-weight: 600; }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes softPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.65; }
    }
    main { animation: fadeSlideUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .tw-card {
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .tw-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(13, 148, 136, 0.09);
    }
    .btn-primary, .btn-secondary {
      transition: transform 0.12s ease, background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-primary:active, .btn-secondary:active {
      transform: scale(0.98);
    }
    .live-dot {
      animation: softPulse 2.2s ease-in-out infinite;
    }
    .map-pin {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .map-pin:hover { transform: translateY(-2px) scale(1.04); }
  </style>
</head>

    let fallbackDB = createFallbackData();

    async function api(method, endpoint, body = null) {
      if (isLiveBackend) {
        try {
          const opts = {
            method,
            headers: {
              'Content-Type': 'application/json',
              'X-User-Id': state.userId || 'u_student'
            }
          };
          if (body) opts.body = JSON.stringify(body);
          const res = await fetch(endpoint, opts);
          const json = await res.json();
          if (json.error) throw new Error(json.error);
          return json;
        } catch (err) {
          showToast(err.message, 'rose');
          throw err;
        }
      }
      return fallbackApi(method, endpoint, body);
    }

    function fallbackApi(method, endpoint, body) {
      const uid = state.userId || 'u_student';
      const user = fallbackDB.users.find(u => u.id === uid) || fallbackDB.users[0];
      const nowStr = new Date().toISOString().slice(0, 16).replace('T', ' ');
      const addAudit = (action, ttype, tid, ttitle, comment = '') => {
        fallbackDB.auditLog.unshift({ id: 'aud_' + Date.now(), actor_id: user.id, actor_name: user.name, actor_role: user.role, action, target_type: ttype, target_id: tid, target_title: ttitle, comment, created_at: nowStr });
      };
      const addNotif = (toUid, title, msg, type = 'info') => {
        fallbackDB.notifications.unshift({ id: 'n_' + Date.now() + Math.random(), user_id: toUid, title, body: msg, type, read: 0, created_at: nowStr });
      };
      const addOutbox = (channel, recipient, subject, msg) => {
        fallbackDB.outbox.unshift({ id: 'out_' + Date.now(), channel, recipient, subject, body: msg, status: 'Simulated', created_at: nowStr });
      };

      if (endpoint === '/api/bootstrap') {
        return {
          currentUser: user,
          ...fallbackDB,
          deadlines: fallbackDB.deadlines.filter(d => d.user_id === uid),
          notifications: fallbackDB.notifications.filter(n => n.user_id === uid)
        };
      }
      if (endpoint === '/api/summarize') {
        return { summary: localSummarize(body) };
      }
      if (endpoint === '/api/signup') {
        const existing = fallbackDB.users.find(u => u.email === body.email);
        if (existing) return { user: existing };
        const nu = { id: 'u_' + Date.now(), name: body.name || 'Campus Student', email: body.email, role: body.role || 'student', department: body.department || 'CSE', year: body.year || '3rd Year', interests: body.interests || ['AI/ML', 'Placements'], whatsapp_opt_in: true, quiet_hours: '22:00 - 07:00', onboarded: false };
        fallbackDB.users.push(nu);
        return { user: nu };
      }
      if (endpoint === '/api/profile') {
        Object.assign(user, { department: body.department, year: body.year, interests: body.interests, whatsapp_opt_in: body.whatsapp_opt_in, quiet_hours: body.quiet_hours, onboarded: true });
        return { ok: true };
      }
      if (endpoint === '/api/upload') {
        return { ok: true, url: '#uploaded-' + (body.filename || 'doc.pdf'), filename: body.filename || 'doc.pdf' };
      }
      if (endpoint === '/api/events') {
        const status = user.role === 'club_rep' ? 'Pending faculty review' : (user.role === 'admin' ? 'Verified' : 'Pending review');
        const ev = { id: 'e_' + Date.now(), ...body, status, red_flags: [], reviewer_comment: '', author_id: uid, history: [{ actor: user.name, action: `Created (${status})`, time: nowStr }], acknowledged_by: [], reached_count: status === 'Verified' ? 120 : 0, created_at: nowStr };
        fallbackDB.events.unshift(ev);
        addAudit('CREATE_EVENT', 'event', ev.id, ev.title, status);
        if (body.club_id) addNotif('u_faculty', 'New club event submitted', `${user.name} submitted '${ev.title}'.`, 'warning');
        return { id: ev.id, status };
      }
      if (endpoint.endsWith('/resubmit')) {
        const eid = endpoint.split('/')[3];
        const ev = fallbackDB.events.find(e => e.id === eid);
        Object.assign(ev, body);
        ev.status = ev.club_id ? 'Pending faculty review' : 'Pending review';
        ev.history.push({ actor: user.name, action: 'Edited & resubmitted', time: nowStr });
        addAudit('RESUBMIT_EVENT', 'event', ev.id, ev.title, 'Resubmitted');
        return { ok: true };
      }
      if (endpoint.endsWith('/faculty-review')) {
        const eid = endpoint.split('/')[3];
        const ev = fallbackDB.events.find(e => e.id === eid);
        const club = fallbackDB.clubs.find(c => c.id === ev.club_id);
        if (body.decision === 'approve') {
          ev.status = (club && club.requires_admin_check) ? 'Pending admin review' : 'Verified';
          ev.history.push({ actor: user.name, action: `Faculty approved -> ${ev.status}`, time: nowStr, comment: body.comment });
          addNotif(ev.author_id, 'Club event approved', `${user.name} approved '${ev.title}'.`, 'success');
        } else if (body.decision === 'changes') {
          ev.status = 'Changes requested';
          ev.history.push({ actor: user.name, action: 'Changes requested', time: nowStr, comment: body.comment });
          addNotif(ev.author_id, 'Changes requested', `'${ev.title}': ${body.comment}`, 'warning');
        } else {
          ev.status = 'Rejected';
          ev.history.push({ actor: user.name, action: 'Rejected', time: nowStr, comment: body.comment });
        }
        ev.reviewer_comment = body.comment || '';
        addAudit(`FACULTY_${body.decision.toUpperCase()}`, 'event', ev.id, ev.title, body.comment);
        return { status: ev.status };
      }
      if (endpoint.endsWith('/admin-verify')) {
        const eid = endpoint.split('/')[3];
        const ev = fallbackDB.events.find(e => e.id === eid);
        if (body.decision === 'verify') {
          ev.status = 'Verified';
          ev.reached_count = 320;
          ev.history.push({ actor: user.name, action: 'Verified & Published', time: nowStr, comment: body.comment });
          fallbackDB.tickets.filter(t => t.event_id === ev.id && (t.status === 'Open' || t.status === 'Reopened')).forEach(t => {
            t.status = 'Resolved';
            t.messages.push({ sender: user.name, role: 'admin', text: `Verified as genuine. ${body.comment || ''}`, time: nowStr });
            addNotif(t.student_id, `Ticket ${t.id} Resolved`, `Admin verified '${ev.title}'.`, 'success');
            addOutbox('WhatsApp', '+91-98XXX-XX104', `Ticket ${t.id} Resolved`, `'${ev.title}' is verified.`);
          });
          if (body.merge_duplicate_id) {
            fallbackDB.events = fallbackDB.events.filter(e => e.id !== body.merge_duplicate_id);
            addAudit('MERGE_DUPLICATE', 'event', body.merge_duplicate_id, ev.title, `Merged into ${ev.id}`);
          }
        } else if (body.decision === 'send_back') {
          ev.status = 'Changes requested';
          ev.history.push({ actor: user.name, action: 'Admin sent back', time: nowStr, comment: body.comment });
        } else {
          ev.status = 'Rejected';
          ev.history.push({ actor: user.name, action: 'Rejected as unverified', time: nowStr, comment: body.comment });
          fallbackDB.tickets.filter(t => t.event_id === ev.id && (t.status === 'Open' || t.status === 'Reopened')).forEach(t => {
            t.status = 'Resolved';
            t.messages.push({ sender: user.name, role: 'admin', text: `Warning: Rejected as unverified/fake. ${body.comment || ''}`, time: nowStr });
            addNotif(t.student_id, `Ticket ${t.id} Resolved`, `'${ev.title}' was rejected by Admin.`, 'danger');
          });
        }
        ev.reviewer_comment = body.comment || '';
        addAudit(`ADMIN_${body.decision.toUpperCase()}`, 'event', ev.id, ev.title, body.comment);
        return { status: ev.status };
      }
      if (endpoint.endsWith('/acknowledge')) {
        const eid = endpoint.split('/')[3];
        const ev = fallbackDB.events.find(e => e.id === eid);
        if (!ev.acknowledged_by.includes(uid)) ev.acknowledged_by.push(uid);
        return { ok: true };
      }
      if (endpoint === '/api/tickets') {
        const ev = fallbackDB.events.find(e => e.id === body.event_id);
        const tid = 'TKT-' + (101 + fallbackDB.tickets.length + 1);
        fallbackDB.tickets.unshift({ id: tid, event_id: ev.id, event_title: ev.title, student_id: uid, student_name: user.name, assigned_admin_id: 'u_admin', assigned_admin_name: 'Siddharth Joshi', question: body.question, status: 'Open', messages: [{ sender: user.name, role: user.role, text: body.question, time: nowStr }], created_at: nowStr, updated_at: nowStr });
        addNotif('u_admin', `New Ticket ${tid}`, `${user.name} requested verification for '${ev.title}'.`, 'info');
        addOutbox('Email', 'siddharth.joshi@college.edu', `[UniSync] Ticket ${tid}`, body.question);
        addAudit('CREATE_TICKET', 'ticket', tid, ev.title, body.question);
        return { id: tid };
      }
      if (endpoint.endsWith('/feedback')) {
        const tid = endpoint.split('/')[3];
        const t = fallbackDB.tickets.find(x => x.id === tid);
        if (body.action === 'close') {
          t.status = 'Closed';
          t.messages.push({ sender: user.name, role: user.role, text: 'Confirmed: Yes, resolved.', time: nowStr });
        } else {
          t.status = 'Reopened';
          t.messages.push({ sender: user.name, role: user.role, text: body.note || 'Still a problem.', time: nowStr });
        }
        addAudit(`TICKET_${body.action.toUpperCase()}`, 'ticket', t.id, t.event_title, t.status);
        return { status: t.status };
      }
      if (endpoint === '/api/deadlines') {
        const ev = fallbackDB.events.find(e => e.id === body.event_id);
        if (!fallbackDB.deadlines.some(d => d.user_id === uid && d.event_id === ev.id)) {
          fallbackDB.deadlines.push({ id: 'dl_' + Date.now(), user_id: uid, event_id: ev.id, title: ev.title, deadline: ev.deadline, category: ev.category, completed: 0, saved: 1 });
          ['3 days before', '1 day before', '2 hours before'].forEach(lbl => {
            fallbackDB.reminders.push({ id: 'rem_' + Date.now() + Math.random(), user_id: uid, event_id: ev.id, event_title: ev.title, offset_label: lbl, scheduled_for: ev.deadline, channel: 'WhatsApp + Push', status: 'Scheduled', message_preview: `Reminder (${lbl}): ${ev.title} closes ${ev.deadline}.`, sent_at: null });
          });
        }
        return { ok: true };
      }
      if (endpoint.endsWith('/toggle')) {
        const did = endpoint.split('/')[3];
        const d = fallbackDB.deadlines.find(x => x.id === did);
        if (d) d.completed = d.completed ? 0 : 1;
        return { ok: true };
      }
      if (endpoint.endsWith('/simulate')) {
        const rid = endpoint.split('/')[3];
        const r = fallbackDB.reminders.find(x => x.id === rid);
        if (r) {
          r.status = 'Sent';
          r.sent_at = nowStr;
          addOutbox('WhatsApp', '+91-98XXX-XX104', `Reminder: ${r.event_title}`, r.message_preview);
          addNotif(r.user_id, `Reminder: ${r.event_title}`, r.message_preview, 'info');
        }
        return { ok: true };
      }
      if (endpoint.endsWith('/join')) {
        const cid = endpoint.split('/')[3];
        const club = fallbackDB.clubs.find(c => c.id === cid);
        const status = club.join_mode === 'instant' ? 'joined' : 'pending';
        const existing = fallbackDB.communityMembers.find(m => m.community_id === cid && m.user_id === uid);
        if (!existing) {
          fallbackDB.communityMembers.push({ id: 'cm_' + Date.now(), community_id: cid, user_id: uid, user_name: user.name, status });
          if (status === 'joined') club.member_count++;
        }
        addAudit('JOIN_COMMUNITY', 'club', cid, club.name, status);
        return { status };
      }
      if (endpoint.endsWith('/approve')) {
        const mid = endpoint.split('/')[3];
        const cm = fallbackDB.communityMembers.find(m => m.id === mid);
        if (cm) {
          cm.status = 'joined';
          const club = fallbackDB.clubs.find(c => c.id === cm.community_id);
          if (club) club.member_count++;
          addNotif(cm.user_id, 'Community request approved', 'WhatsApp invite link is now unlocked.', 'success');
        }
        return { ok: true };
      }
      if (endpoint === '/api/qa') {
        fallbackDB.qaPosts.unshift({ id: 'qa_' + Date.now(), community_id: body.community_id, author_id: uid, author_name: user.name, author_role: user.role, title: body.title, body: body.body, upvotes: 1, created_at: nowStr });
        return { ok: true };
      }
      if (endpoint.endsWith('/answer')) {
        const pid = endpoint.split('/')[3];
        fallbackDB.qaAnswers.push({ id: 'ans_' + Date.now(), post_id: pid, author_id: uid, author_name: user.name, author_role: user.role, body: body.body, created_at: nowStr });
        return { ok: true };
      }
      if (endpoint.endsWith('/upvote')) {
        const pid = endpoint.split('/')[3];
        const p = fallbackDB.qaPosts.find(x => x.id === pid);
        if (p) p.upvotes++;
        return { ok: true };
      }
      if (endpoint === '/api/admin/tags') {
        if (body.action === 'add') fallbackDB.tags.push({ id: 't_' + Date.now(), name: body.name, color: body.color || 'teal', active: 1 });
        if (body.action === 'toggle') { const t = fallbackDB.tags.find(x => x.id === body.tag_id); if (t) t.active = t.active ? 0 : 1; }
        return { ok: true };
      }
      if (endpoint.startsWith('/api/admin/clubs/')) {
        const cid = endpoint.split('/')[4];
        const c = fallbackDB.clubs.find(x => x.id === cid);
        if (c) Object.assign(c, { requires_admin_check: body.requires_admin_check ? 1 : 0, join_mode: body.join_mode, coordinator_id: body.coordinator_id, rep_id: body.rep_id });
        return { ok: true };
      }
      if (endpoint.startsWith('/api/admin/routes/')) {
        const cat = decodeURIComponent(endpoint.split('/')[4]);
        const r = fallbackDB.routes.find(x => x.category === cat);
        if (r) Object.assign(r, body);
        return { ok: true };
      }
      if (endpoint.startsWith('/api/cabins/')) {
        const cid = endpoint.split('/')[3];
        const cab = fallbackDB.facultyCabins.find(c => c.id === cid);
        if (cab) { cab.status = body.status; cab.note = body.note || ''; }
        return { ok: true };
      }
      if (endpoint.startsWith('/api/venues/')) {
        const vid = endpoint.split('/')[3];
        const slot = fallbackDB.venueSlots.find(v => v.id === vid);
        if (slot) {
          slot.status = slot.status === 'Available' ? 'Booked' : 'Available';
          slot.booked_by = slot.status === 'Booked' ? (body.booked_by || 'Reserved by Events Admin') : '';
        }
        return { ok: true };
      }
      if (endpoint === '/api/notifications/read') {
        fallbackDB.notifications.filter(n => n.user_id === uid).forEach(n => n.read = 1);
        return { ok: true };
      }
      return { ok: true };
    }

    // =========================================================================
    // 2. HELPERS (Badges, Relevance, Countdowns, Google Calendar Link)
    // =========================================================================
    function localSummarize(ev) {
      if (ev.ai_summary) return ev.ai_summary;
      const sentences = String(ev.description || '').split('.').map(s => s.trim()).filter(Boolean);
      let lead = sentences[0] || ev.title || '';
      if (lead.length > 110) lead = lead.slice(0, 107) + '...';
      const parts = [
        `Core: ${lead}.`,
        `When & Where: ${ev.venue || 'Campus'} · Deadline ${ev.deadline || 'TBD'}.`,
        `Eligibility: ${ev.department || 'All'} · ${ev.target_year || 'All'} (${ev.is_free ? 'Free' : 'Fee noted'}).`
      ];
      if (ev.red_flags && ev.red_flags.length) parts.push(`Caution: ${ev.red_flags[0]}.`);
      return parts.join(' | ');
    }

    window.previewAiSummary = async (formId, outId) => {
      const form = document.getElementById(formId);
      const out = document.getElementById(outId);
      if (!form || !out) return;
      const fd = new FormData(form);
      const res = await api('POST', '/api/summarize', {
        title: fd.get('title') || '',
        description: fd.get('description') || '',
        deadline: (fd.get('deadline') || '').replace('T', ' '),
        venue: fd.get('venue') || '',
        department: fd.get('department') || 'All',
        target_year: fd.get('target_year') || 'All',
        is_free: fd.get('is_free') !== null
      });
      out.classList.remove('hidden');
      out.innerHTML = `<p class="font-bold text-teal-800 mb-1">✨ AI Student Summary Preview</p><ul class="list-disc pl-4 space-y-0.5">${res.summary.split(' | ').map(b => `<li>${escapeHtml(b)}</li>`).join('')}</ul>`;
    };

    function getStatusPill(status) {
      if (status === 'Verified') return `<span class="pill bg-emerald-50 text-emerald-700 border border-emerald-200"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Verified</span>`;
      if (status === 'Pending review' || status === 'Pending faculty review' || status === 'Pending admin review') {
        return `<span class="pill bg-amber-50 text-amber-700 border border-amber-200"><span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>${escapeHtml(status)}</span>`;
      }
      if (status === 'Changes requested') return `<span class="pill bg-teal-50 text-teal-700 border border-teal-200">Changes requested</span>`;
      return `<span class="pill bg-rose-50 text-rose-700 border border-rose-200">${escapeHtml(status)}</span>`;
    }

    function getCountdownText(deadlineStr) {
      const target = new Date(deadlineStr.replace(' ', 'T'));
      const diffMs = target - DEMO_NOW;
      if (isNaN(diffMs)) return deadlineStr;
      if (diffMs <= 0) return 'Closed';
      const hrs = Math.floor(diffMs / 3600000);
      const days = Math.floor(hrs / 24);
      if (days >= 1) return `${days}d ${hrs % 24}h left`;
      return `${hrs}h left`;
    }

    function isClosingSoon(deadlineStr) {
      const target = new Date(deadlineStr.replace(' ', 'T'));
      const diffHrs = (target - DEMO_NOW) / 3600000;
      return diffHrs > 0 && diffHrs <= 72;
    }

    function isEligible(ev, user) {
      if (!user) return true;
      const deptOk = ev.department === 'All' || ev.department === user.department;
      const yearOk = ev.target_year === 'All' || ev.target_year === user.year;
      return deptOk && yearOk;
    }

    function computeRelevance(ev, user) {
      if (!user) return 0;
      let score = 0;
      if (ev.status === 'Verified') score += 20;
      if (isEligible(ev, user)) score += 15;
      const matchedTags = (ev.tags || []).filter(t => (user.interests || []).includes(t));
      score += matchedTags.length * 12;
      if (isClosingSoon(ev.deadline)) score += 5;
      return score;
    }

    function googleCalendarUrl(ev) {
      const start = ev.event_date.replace(/[-: ]/g, '').slice(0, 13) + '00Z';
      const end = ev.deadline.replace(/[-: ]/g, '').slice(0, 13) + '00Z';
      return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(ev.title)}&dates=${start}/${end}&details=${encodeURIComponent(ev.description)}&location=${encodeURIComponent(ev.venue)}`;
    }

    function getNavItems(role) {
      const base = [
        { id: 'home', label: 'Home' },
        { id: 'explore', label: 'Explore' },
        { id: 'schedule', label: 'Schedule & Cabins' },
        { id: 'communities', label: 'Communities' },

      if (role === 'faculty') {
        base.push({ id: 'faculty-publish', label: 'Publish' });

        base.push({ id: 'admin-manage', label: 'Manage' });
        base.push({ id: 'admin-automation', label: 'Automation & Logs' });
      }
      return base;
    }

        email: fd.get('email'),
        role: fd.get('role'),
        department: fd.get('department'),

                  <input type="checkbox" name="whatsapp_opt_in" ${user.whatsapp_opt_in ? 'checked' : ''} class="w-4 h-4 accent-teal-600" />
                  <span>Enable WhatsApp urgent alerts</span>
                </label>
                <div>
                  <label class="text-xs font-semibold text-slate-700">Quiet Hours</label>
                  <input name="quiet_hours" value="${escapeHtml(user.quiet_hours)}" class="mt-1 w-full px-3 py-1.5 rounded-xl border border-slate-200 text-sm" />
                </div>
              </div>
              <button type="submit" class="btn-primary px-6 py-2.5 text-sm">Save & Go to Dashboard</button>
            </form>
          </div>
        </main>
      `;
    }

    function renderEventCard(ev, user) {
      const eligible = isEligible(ev, user);
      const closing = isClosingSoon(ev.deadline);
      return `
        <div class="tw-card p-5 flex flex-col justify-between gap-4 hover:border-teal-300 transition cursor-pointer" onclick="nav('event-detail', { selectedEventId: '${ev.id}' })">
          <div class="space-y-2.5">
            <div class="flex flex-wrap items-center gap-1.5">
              ${getStatusPill(ev.status)}
              ${closing ? `<span class="pill bg-rose-50 text-rose-700 border border-rose-200">Closing soon</span>` : (eligible ? `<span class="pill bg-teal-50 text-teal-700 border border-teal-100">For you</span>` : '')}
            </div>
            <h3 class="font-bold text-slate-900 text-base leading-snug">${escapeHtml(ev.title)}</h3>
            <p class="text-xs text-slate-600 line-clamp-2"><span class="font-semibold text-teal-700">✨ Summary:</span> ${escapeHtml(localSummarize(ev).split(" | ")[0].replace("Core: ", ""))}</p>
            ${(ev.red_flags && ev.red_flags.length) ? `
              <div class="p-2.5 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-800 font-medium">
                ⚠ ${escapeHtml(ev.red_flags[0])}
              </div>
            ` : ''}
            <div class="flex flex-wrap gap-1.5 pt-1">
              ${(ev.tags || []).slice(0, 2).map(t => `<span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-[11px]">#${escapeHtml(t)}</span>`).join('')}
            </div>
          </div>
          <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
            <span>${escapeHtml(ev.venue)} · ${escapeHtml(ev.department)}</span>
            <span class="font-semibold text-teal-600">${getCountdownText(ev.deadline)}</span>
          </div>
        </div>
      `;
    }

    function renderHome() {
      const d = state.data;
      const user = d.currentUser;
      const verifiedEvents = d.events.filter(e => e.status === 'Verified');
      const forYou = [...verifiedEvents].sort((a, b) => computeRelevance(b, user) - computeRelevance(a, user)).slice(0, 3);
      const pendingTickets = d.tickets.filter(t => t.student_id === user.id && t.status !== 'Closed');
      const flaggedEvents = d.events.filter(e => e.red_flags && e.red_flags.length > 0 && e.status !== 'Rejected');

      if (user.role === 'club_rep') {
        const myClub = d.clubs.find(c => c.rep_id === user.id) || d.clubs[0];
        const coord = d.users.find(u => u.id === myClub.coordinator_id);
        const myEvents = d.events.filter(e => e.author_id === user.id || e.club_id === myClub.id);
        return `
          <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-6">
            <div class="tw-card p-6 flex flex-wrap items-center justify-between gap-4">
              <div>
                <span class="pill bg-teal-50 text-teal-700 mb-2">${escapeHtml(myClub.name)} · Faculty coordinator: ${escapeHtml(coord?.name || 'Prof. Ananya Rao')}</span>
                <h1 class="text-2xl font-bold text-slate-900">Welcome back, ${escapeHtml(user.name)}</h1>
              </div>
              <button onclick="nav('club-management')" class="btn-primary px-5 py-2.5 text-sm">+ Submit Club Event</button>
            </div>
            <div class="grid md:grid-cols-2 gap-4">
              ${myEvents.map(ev => renderEventCard(ev, user)).join('')}
            </div>
          </main>
        `;
      }

      if (user.role === 'faculty') {
        const assignedClubs = d.clubs.filter(c => c.coordinator_id === user.id);
        const pendingClubEvents = d.events.filter(e => e.status === 'Pending faculty review' && assignedClubs.some(c => c.id === e.club_id));
        return `
          <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-6">
            <div class="tw-card p-6 flex flex-wrap items-center justify-between gap-4">
              <div>
                <span class="pill bg-teal-50 text-teal-700 mb-2">Faculty Coordinator · ${assignedClubs.map(c => c.name).join(', ')}</span>
                <h1 class="text-2xl font-bold text-slate-900">Welcome, ${escapeHtml(user.name)}</h1>
              </div>
              <div class="flex gap-2.5">
                <button onclick="nav('club-approvals')" class="btn-primary px-4 py-2.5 text-sm">Club Approvals (${pendingClubEvents.length})</button>
                <button onclick="nav('faculty-publish')" class="btn-secondary px-4 py-2.5 text-sm">Publish Notice</button>
              </div>
            </div>
            <div class="grid md:grid-cols-2 gap-4">
              ${d.events.filter(e => e.author_id === user.id || e.status === 'Pending faculty review').map(ev => renderEventCard(ev, user)).join('')}
            </div>
          </main>
        `;
      }

      if (user.role === 'admin') {
        const queueCount = d.events.filter(e => e.status === 'Pending review' || e.status === 'Pending admin review').length;
        const openTickets = d.tickets.filter(t => t.status === 'Open' || t.status === 'Reopened').length;
        return `
          <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-6">
            <div class="tw-card p-6 flex flex-wrap items-center justify-between gap-4">
              <div>
                <span class="pill bg-teal-50 text-teal-700 mb-2">Campus Admin Control</span>
                <h1 class="text-2xl font-bold text-slate-900">Verification & Governance</h1>
              </div>
              <div class="flex flex-wrap gap-2.5">
                <button onclick="nav('admin-queue')" class="btn-primary px-4 py-2.5 text-sm">Verification Queue (${queueCount})</button>
                <button onclick="nav('admin-automation')" class="btn-secondary px-4 py-2.5 text-sm">Reminders, Outbox & Audit</button>
              </div>
            </div>
            <div class="grid md:grid-cols-3 gap-4">
              <div class="tw-card p-5"><p class="text-xs font-semibold text-slate-500">Pending Verification</p><p class="text-3xl font-extrabold text-teal-600 mt-1">${queueCount}</p></div>
              <div class="tw-card p-5"><p class="text-xs font-semibold text-slate-500">Open / Reopened Tickets</p><p class="text-3xl font-extrabold text-amber-600 mt-1">${openTickets}</p></div>
              <div class="tw-card p-5"><p class="text-xs font-semibold text-slate-500">Audit Log Entries</p><p class="text-3xl font-extrabold text-emerald-600 mt-1">${d.auditLog.length}</p></div>
            </div>
          </main>
        `;
      }

      // Student Home (Split Bento Layout)
      return `
        <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 grid lg:grid-cols-12 gap-6">
          <div class="lg:col-span-8 space-y-6">
            <div class="tw-card p-6 flex flex-wrap items-center justify-between gap-4">
              <div>
                <div class="flex flex-wrap items-center gap-2 mb-2">
                  <span class="pill bg-teal-50 text-teal-700">${escapeHtml(user.department)} · ${escapeHtml(user.year)}</span>
                  ${(user.interests || []).slice(0, 3).map(t => `<span class="pill bg-slate-100 text-slate-600">#${escapeHtml(t)}</span>`).join('')}
                </div>
                <h1 class="text-2xl font-bold text-slate-900">For You, ${escapeHtml(user.name)}</h1>
              </div>
              <button onclick="nav('explore')" class="btn-primary px-4 py-2 text-sm">Browse All</button>
            </div>

            ${flaggedEvents.length ? `
              <div class="p-4 rounded-2xl bg-amber-50 border border-amber-200 flex flex-wrap items-center justify-between gap-3">
                <div>
                  <p class="text-xs font-bold text-amber-800 uppercase tracking-wide">Priority Caution</p>
                  <p class="text-sm font-semibold text-slate-900">${escapeHtml(flaggedEvents[0].title)} — ${escapeHtml(flaggedEvents[0].red_flags[0])}</p>
                </div>
                <button onclick="nav('event-detail', { selectedEventId: '${flaggedEvents[0].id}' })" class="btn-secondary px-3.5 py-1.5 text-xs">Inspect Notice</button>
              </div>
            ` : ''}

            <div class="grid sm:grid-cols-2 gap-4">
              ${forYou.map(ev => renderEventCard(ev, user)).join('')}
            </div>
          </div>

          <!-- Right Sidebar: Deadlines & Tickets -->
          <div class="lg:col-span-4 space-y-5">
            <div class="tw-card p-5 space-y-3">
              <div class="flex items-center justify-between">
                <h2 class="font-bold text-slate-900 text-base">My Deadlines</h2>
                <button onclick="nav('deadlines')" class="text-xs font-semibold text-teal-600">View all →</button>
              </div>
              ${d.deadlines.length ? d.deadlines.slice(0, 3).map(dl => `
                <div class="p-3 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-between gap-2">
                  <div class="min-w-0">
                    <p class="text-xs font-semibold text-slate-900 truncate ${dl.completed ? 'line-through text-slate-400' : ''}">${escapeHtml(dl.title)}</p>
                    <p class="text-[11px] text-teal-600 font-medium">${getCountdownText(dl.deadline)}</p>
                  </div>
                  <button onclick="toggleDeadline('${dl.id}')" class="text-xs px-2.5 py-1 rounded-lg border ${dl.completed ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-white border-slate-200 text-slate-600'}">${dl.completed ? 'Done' : 'Mark'}</button>
                </div>
              `).join('') : `<p class="text-xs text-slate-500">No saved deadlines yet.</p>`}
            </div>

            <div class="tw-card p-5 space-y-3">
              <div class="flex items-center justify-between">
                <h2 class="font-bold text-slate-900 text-base">Verification Tickets</h2>
                <button onclick="nav('inbox')" class="text-xs font-semibold text-teal-600">Inbox →</button>
              </div>
              ${pendingTickets.length ? pendingTickets.map(t => `
                <div class="p-3 rounded-xl bg-slate-50 border border-slate-100 space-y-1 cursor-pointer" onclick="nav('inbox')">
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-teal-600">${escapeHtml(t.id)}</span>
                    <span class="pill bg-white border border-slate-200 text-[11px]">${escapeHtml(t.status)}</span>
                  </div>
                  <p class="text-xs font-semibold text-slate-900">${escapeHtml(t.event_title)}</p>
                </div>
              `).join('') : `<p class="text-xs text-slate-500">No active verification tickets.</p>`}
            </div>
          </div>
        </main>
      `;
    }

    function renderExplore() {
      const d = state.data;
      const user = d.currentUser;
      const f = state.exploreFilters;
      const activeTags = d.tags.filter(t => t.active);

      let list = d.events.filter(e => e.status === 'Verified' || e.status === 'Pending review');
      if (f.category !== 'All') list = list.filter(e => e.category === f.category);
      if (f.department !== 'All') list = list.filter(e => e.department === 'All' || e.department === f.department);
      if (f.year !== 'All') list = list.filter(e => e.target_year === 'All' || e.target_year === f.year);
      if (f.tag !== 'All') list = list.filter(e => (e.tags || []).includes(f.tag));
      if (f.search.trim()) {
        const q = f.search.toLowerCase();
        list = list.filter(e => e.title.toLowerCase().includes(q) || e.description.toLowerCase().includes(q));
      }
      if (f.sort === 'relevant') {
        list.sort((a, b) => computeRelevance(b, user) - computeRelevance(a, user));
      } else {
        list.sort((a, b) => a.deadline.localeCompare(b.deadline));
      }

      return `
        <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-6">
          <div class="tw-card p-5 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <h1 class="text-2xl font-bold text-slate-900">Explore Campus Feed</h1>
              <input value="${escapeHtml(f.search)}" oninput="state.exploreFilters.search=this.value;render()" placeholder="Search notices, companies, clubs..." class="w-full sm:w-72 px-3.5 py-2 rounded-xl border border-slate-200 text-sm" />
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <select onchange="state.exploreFilters.category=this.value;render()" class="px-3 py-2 rounded-xl border border-slate-200 text-sm">
                ${['All', 'Placements', 'Hackathons', 'Workshops', 'Clubs', 'Academics'].map(c => `<option ${f.category === c ? 'selected' : ''}>${c}</option>`).join('')}
              </select>
              <select onchange="state.exploreFilters.department=this.value;render()" class="px-3 py-2 rounded-xl border border-slate-200 text-sm">
                ${['All', 'CSE', 'IT', 'ECE'].map(dep => `<option ${f.department === dep ? 'selected' : ''}>${dep}</option>`).join('')}
              </select>
              <select onchange="state.exploreFilters.year=this.value;render()" class="px-3 py-2 rounded-xl border border-slate-200 text-sm">
                ${['All', '1st Year', '2nd Year', '3rd Year', '4th Year'].map(y => `<option ${f.year === y ? 'selected' : ''}>${y}</option>`).join('')}
              </select>
              <select onchange="state.exploreFilters.sort=this.value;render()" class="px-3 py-2 rounded-xl border border-slate-200 text-sm">
                <option value="relevant" ${f.sort === 'relevant' ? 'selected' : ''}>Most Relevant</option>
                <option value="deadline" ${f.sort === 'deadline' ? 'selected' : ''}>Closing Soonest</option>
              </select>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button onclick="state.exploreFilters.tag='All';render()" class="pill ${f.tag === 'All' ? 'bg-teal-600 text-white' : 'bg-slate-100 text-slate-700'}">All Tags</button>
              ${activeTags.map(t => `
                <button onclick="state.exploreFilters.tag='${escapeHtml(t.name)}';render()" class="pill ${f.tag === t.name ? 'bg-teal-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-teal-50'}">#${escapeHtml(t.name)}</button>
              `).join('')}
            </div>
          </div>

          <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
            ${list.length ? list.map(ev => renderEventCard(ev, user)).join('') : `<div class="tw-card p-8 col-span-full text-center text-sm text-slate-500">No events match your current filters.</div>`}
          </div>
        </main>
      `;
    }

    function renderEventDetail() {
      const d = state.data;
      const user = d.currentUser;
      const ev = d.events.find(e => e.id === state.selectedEventId) || d.events[0];
      const alreadyDeadline = d.deadlines.some(dl => dl.event_id === ev.id);
      const acked = (ev.acknowledged_by || []).includes(user.id);

      return `
        <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8 space-y-6">
          <button onclick="nav('explore')" class="text-xs font-semibold text-teal-600 hover:underline">← Back to Explore</button>
          <div class="grid lg:grid-cols-12 gap-6">
            <div class="lg:col-span-8 tw-card p-6 space-y-5">
              <div class="flex flex-wrap items-center gap-2">
                ${getStatusPill(ev.status)}
                <span class="pill bg-slate-100 text-slate-700">${escapeHtml(ev.category)}</span>
                ${isEligible(ev, user) ? `<span class="pill bg-teal-50 text-teal-700">Eligible for you</span>` : ''}
                ${isClosingSoon(ev.deadline) ? `<span class="pill bg-rose-50 text-rose-700">Closing soon</span>` : ''}
              </div>
              <h1 class="text-2xl font-bold text-slate-900">${escapeHtml(ev.title)}</h1>
              <div class="p-4 rounded-2xl bg-teal-50/80 border border-teal-200 space-y-1.5">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-bold text-teal-800">✨ AI Notice Summary (Shortened for Students)</span>
                  <span class="pill bg-white text-teal-700 text-[10px]">TL;DR</span>
                </div>
                <ul class="list-disc pl-4 text-xs text-slate-700 space-y-1">
                  ${localSummarize(ev).split(' | ').map(b => `<li>${escapeHtml(b)}</li>`).join('')}
                </ul>
              </div>
              <details class="text-sm text-slate-700 leading-relaxed" open>
                <summary class="text-xs font-semibold text-slate-500 cursor-pointer mb-1">Full Original Notice</summary>
                <p>${escapeHtml(ev.description)}</p>
              </details>

              ${(ev.red_flags && ev.red_flags.length) ? `
                <div class="p-4 rounded-2xl bg-rose-50 border border-rose-200 space-y-1.5">
                  <p class="text-xs font-bold text-rose-800 uppercase">Verification Red Flags</p>
                  <ul class="list-disc pl-5 text-xs text-rose-700 space-y-1">
                    ${ev.red_flags.map(rf => `<li>${escapeHtml(rf)}</li>`).join('')}
                  </ul>
                </div>
              ` : ''}

              <div class="grid sm:grid-cols-2 gap-3 p-4 rounded-2xl bg-slate-50 border border-slate-100 text-xs">
                <div><span class="text-slate-500">Venue:</span> <strong class="text-slate-900">${escapeHtml(ev.venue)}</strong></div>
                <div><span class="text-slate-500">Event Date:</span> <strong class="text-slate-900">${escapeHtml(ev.event_date)}</strong></div>
                <div><span class="text-slate-500">Deadline:</span> <strong class="text-teal-700">${escapeHtml(ev.deadline)} (${getCountdownText(ev.deadline)})</strong></div>
                <div><span class="text-slate-500">Audience:</span> <strong class="text-slate-900">${escapeHtml(ev.department)} · ${escapeHtml(ev.target_year)}</strong></div>
                <div class="sm:col-span-2"><span class="text-slate-500">Source Proof:</span> <strong class="text-slate-900">${escapeHtml(ev.source_doc)}</strong></div>
              </div>

              <div class="flex flex-wrap gap-2.5">
                <button onclick="addToDeadlines('${ev.id}')" class="btn-primary px-4 py-2 text-xs" ${alreadyDeadline ? 'disabled style="opacity:0.6"' : ''}>
                  ${alreadyDeadline ? '✓ Added to My Deadlines' : '+ Add to My Deadlines'}
                </button>
                <a href="${googleCalendarUrl(ev)}" target="_blank" rel="noopener" class="btn-secondary px-4 py-2 text-xs inline-flex items-center">Add to Google Calendar ↗</a>
                <a href="${escapeHtml(ev.registration_link)}" target="_blank" rel="noopener" class="btn-secondary px-4 py-2 text-xs inline-flex items-center">Official Link ↗</a>
                <button onclick="acknowledgeEvent('${ev.id}')" class="btn-secondary px-4 py-2 text-xs">${acked ? '✓ Acknowledged' : 'Acknowledge Notice'}</button>
              </div>

              <div class="pt-4 border-t border-slate-100 space-y-2">
                <h3 class="text-xs font-bold uppercase text-slate-500">Approval & Verification History</h3>
                ${(ev.history || []).map(h => `
                  <div class="text-xs flex items-center justify-between py-1 border-b border-slate-50">
                    <span><strong>${escapeHtml(h.actor)}</strong> — ${escapeHtml(h.action)} ${h.comment ? `(${escapeHtml(h.comment)})` : ''}</span>
                    <span class="text-slate-400">${escapeHtml(h.time)}</span>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Right Panel: Request Verification -->
            <div class="lg:col-span-4 space-y-4">
              <div class="tw-card p-5 space-y-3">
                <h2 class="font-bold text-slate-900 text-base">Unsure if this is genuine?</h2>
                <p class="text-xs text-slate-600">Submit a verification ticket directly to the Placement / Admin cell. You can track and confirm resolution in your Inbox.</p>
                <textarea id="verify-question-input" rows="3" placeholder="Ask admin e.g. Is this fee link official?" class="w-full p-3 rounded-xl border border-slate-200 text-xs"></textarea>
                <button onclick="requestVerification('${ev.id}')" class="w-full btn-primary py-2.5 text-xs">Request Verification</button>
              </div>
            </div>
          </div>
        </main>
      `;
    }

    function renderDeadlines() {
      const d = state.data;
      const myRems = d.reminders.filter(r => r.user_id === d.currentUser.id);
      return `
        <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 grid lg:grid-cols-12 gap-6">
          <div class="lg:col-span-7 tw-card p-6 space-y-4">
            <h1 class="text-xl font-bold text-slate-900">My Deadlines</h1>
            <div class="space-y-3">
              ${d.deadlines.length ? d.deadlines.map(dl => `
                <div class="p-4 rounded-2xl border border-slate-200 flex items-center justify-between gap-3">
                  <div>
                    <span class="pill bg-teal-50 text-teal-700 text-[11px] mb-1">${escapeHtml(dl.category)}</span>
                    <h3 class="font-bold text-sm text-slate-900 ${dl.completed ? 'line-through text-slate-400' : ''}">${escapeHtml(dl.title)}</h3>
                    <p class="text-xs text-slate-500 mt-0.5">Closes: ${escapeHtml(dl.deadline)} · <strong class="text-teal-600">${getCountdownText(dl.deadline)}</strong></p>
                  </div>
                  <div class="flex items-center gap-2 shrink-0">
                    <button onclick="nav('event-detail', { selectedEventId: '${dl.event_id}' })" class="btn-secondary px-3 py-1.5 text-xs">Open</button>
                    <button onclick="toggleDeadline('${dl.id}')" class="btn-primary px-3 py-1.5 text-xs">${dl.completed ? 'Completed ✓' : 'Mark Done'}</button>
                  </div>
                </div>
              `).join('') : `<p class="text-sm text-slate-500">No deadlines saved yet. Open any event in Explore to add it.</p>`}
            </div>
          </div>

          <div class="lg:col-span-5 tw-card p-6 space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Reminder Schedule (3d / 1d / 2h)</h2>
            <div class="space-y-2.5">
              ${myRems.map(r => `
                <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-100 space-y-1.5">
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-slate-800">${escapeHtml(r.event_title)}</span>
                    <span class="pill ${r.status === 'Sent' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'} text-[11px]">${escapeHtml(r.status)}</span>
                  </div>
                  <p class="text-[11px] text-slate-600">${escapeHtml(r.offset_label)} · ${escapeHtml(r.message_preview)}</p>
                  ${r.status !== 'Sent' ? `<button onclick="simulateReminder('${r.id}')" class="text-xs font-semibold text-teal-600 hover:underline">Remind me now (simulate WhatsApp)</button>` : ''}
                </div>
              `).join('')}
            </div>

                  <p class="text-sm text-slate-600">${escapeHtml(ev.description)}</p>
                  <input id="fac-comment-${ev.id}" placeholder="Add review comment (optional for approve, required for changes)..." class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-xs" />
                  <div class="flex flex-wrap gap-2">
                    <button onclick="facultyReview('${ev.id}', 'approve')" class="btn-primary px-4 py-2 text-xs bg-emerald-600 hover:bg-emerald-700">Approve</button>
                    <button onclick="facultyReview('${ev.id}', 'changes')" class="btn-secondary px-4 py-2 text-xs">Request Changes</button>
                    <button onclick="facultyReview('${ev.id}', 'reject')" class="btn-secondary px-4 py-2 text-xs text-rose-600">Reject</button>
                  </div>
                </div>
              `;
            }).join('') : `<div class="tw-card p-8 text-center text-sm text-slate-500">All club requests reviewed!</div>`}
          </main>
        `;
      }

      // Faculty Publish & Reach
      const myPublished = d.events.filter(e => e.author_id === user.id);
      return `
        <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 grid lg:grid-cols-12 gap-6">
          <div class="lg:col-span-5 space-y-5">
            <div class="tw-card p-5 space-y-3">
              <h2 class="text-base font-bold text-slate-900">My Cabin Availability (CS-204)</h2>
              <form onsubmit="updateCabin(event, 'cab_1')" class="space-y-2.5">
                <div class="flex gap-2">
                  <select name="status" class="px-3 py-1.5 rounded-xl border border-slate-200 text-xs">
                    <option>Available</option><option>In Lecture</option><option>On Break</option>
                  </select>
                  <input name="note" placeholder="Status note (e.g. Free till 4:30 PM)" class="flex-1 px-3 py-1.5 rounded-xl border border-slate-200 text-xs" />
                </div>
                <button type="submit" class="btn-primary px-4 py-1.5 text-xs">Update Cabin Status</button>
              </form>
            </div>
            <div class="tw-card p-6 space-y-4">
            <h1 class="text-xl font-bold text-slate-900">Publish Announcement / Event</h1>
            <form id="faculty-event-form" onsubmit="createEventForm(event, false)" class="space-y-3">
              <input name="title" required placeholder="Announcement Title" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm" />
              <textarea name="description" rows="3" required placeholder="Details..." class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm"></textarea>
              <div class="grid grid-cols-3 gap-2">
                <select name="category" class="px-2.5 py-2 rounded-xl border border-slate-200 text-xs"><option>Workshops</option><option>Placements</option><option>Academics</option></select>
                <select name="department" class="px-2.5 py-2 rounded-xl border border-slate-200 text-xs"><option>CSE</option><option>All</option></select>
                <select name="target_year" class="px-2.5 py-2 rounded-xl border border-slate-200 text-xs"><option>3rd Year</option><option>All</option></select>
              </div>
              <input name="source_doc" placeholder="Circular / Source Reference #CSE-99" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm" />
              <input name="venue" value="CS Seminar Hall" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm" />
              <input name="event_date" type="hidden" value="2026-11-27 11:00" />
              <input name="deadline" type="hidden" value="2026-11-25 17:00" />
              <input name="registration_link" type="hidden" value="https://example.com/faculty-notice" />
              <input type="file" class="text-xs w-full" />
              <div id="fac-ai-preview" class="hidden p-3 rounded-xl bg-teal-50 border border-teal-200 text-xs text-slate-700"></div>
              <div class="flex gap-2">
                <button type="button" onclick="previewAiSummary('faculty-event-form', 'fac-ai-preview')" class="btn-secondary px-3 py-2.5 text-xs shrink-0">✨ AI Summarize</button>
                <button type="submit" class="flex-1 btn-primary py-2.5 text-sm">Submit for Admin Verification</button>
              </div>
            </form>
          </div>
          </div>
          <div class="lg:col-span-7 tw-card p-6 space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Reach & Acknowledgement Tracking</h2>
            ${myPublished.map(ev => `
              <div class="p-4 rounded-2xl border border-slate-200 flex items-center justify-between gap-4">
                <div>
                  <div class="flex items-center gap-2 mb-1">${getStatusPill(ev.status)}</div>
                  <p class="font-bold text-sm text-slate-900">${escapeHtml(ev.title)}</p>
                </div>
                <div class="text-right text-xs">
                  <p class="font-bold text-teal-600">${ev.reached_count} reached</p>
                  <p class="text-slate-500">${(ev.acknowledged_by || []).length} acknowledged</p>
                </div>
              </div>
            `).join('')}
          </div>
        </main>
      `;
    }

    function renderAdminViews() {
      const d = state.data;
      if (state.view === 'admin-queue') {
        const noticeQueue = d.events.filter(e => e.status === 'Pending review');
        const clubQueue = d.events.filter(e => e.status === 'Pending admin review');
        const nimbusDup = d.events.find(e => e.id === 'e_nimbus_dup');
        return `
          <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 space-y-6">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <h1 class="text-2xl font-bold text-slate-900">Admin Verification Queue</h1>
              <div class="flex gap-2">
                <button onclick="state.adminTab='notices';render()" class="nav-pill ${state.adminTab === 'notices' ? 'active' : ''}">Notices & Duplicates (${noticeQueue.length})</button>
                <button onclick="state.adminTab='clubs';render()" class="nav-pill ${state.adminTab === 'clubs' ? 'active' : ''}">Club Events (${clubQueue.length})</button>
              </div>
            </div>
            <div class="space-y-4">
              ${(state.adminTab === 'notices' ? noticeQueue : clubQueue).map(ev => `
                <div class="tw-card p-6 space-y-3">
                  <div class="flex items-center justify-between">
                    <h2 class="text-lg font-bold text-slate-900">${escapeHtml(ev.title)}</h2>
                    ${getStatusPill(ev.status)}
                  </div>
                  <p class="text-sm text-slate-600">${escapeHtml(ev.description)}</p>
                  <p class="text-xs text-slate-500">Source: <strong>${escapeHtml(ev.source_doc)}</strong></p>
                  <input id="adm-comment-${ev.id}" placeholder="Verification note for students & audit log..." class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-xs" />
                  <div class="flex flex-wrap gap-2">
                    <button onclick="adminVerify('${ev.id}', 'verify')" class="btn-primary px-4 py-2 text-xs bg-emerald-600 hover:bg-emerald-700">Verify & Publish</button>
                    ${(ev.id === 'e_nimbus' && nimbusDup) ? `<button onclick="adminVerify('${ev.id}', 'verify', 'e_nimbus_dup')" class="btn-primary px-4 py-2 text-xs">Verify & Merge Duplicate</button>` : ''}
                    ${state.adminTab === 'clubs' ? `<button onclick="adminVerify('${ev.id}', 'send_back')" class="btn-secondary px-4 py-2 text-xs">Send Back</button>` : ''}
                    <button onclick="adminVerify('${ev.id}', 'reject')" class="btn-secondary px-4 py-2 text-xs text-rose-600">Reject (Mark Fake)</button>
                  </div>
                </div>
              `).join('') || `<div class="tw-card p-8 text-center text-sm text-slate-500">Queue is clear!</div>`}
            </div>
          </main>
        `;
      }

      if (state.view === 'admin-manage') {
        return `
          <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 space-y-6">
            <h1 class="text-2xl font-bold text-slate-900">Manage Roles, Clubs & Tags</h1>
            <div class="grid lg:grid-cols-12 gap-6">
              <div class="lg:col-span-7 tw-card p-6 space-y-4">
                <h2 class="text-lg font-bold text-slate-900">Clubs & Approval Rules</h2>
                ${d.clubs.map(c => `
                  <form onsubmit="adminSaveClub(event, '${c.id}')" class="p-4 rounded-2xl border border-slate-200 space-y-3">
                    <div class="flex items-center justify-between">
                      <strong class="text-sm text-slate-900">${escapeHtml(c.name)}</strong>
                      <button type="submit" class="btn-primary px-3 py-1 text-xs">Save</button>
                    </div>
                    <div class="grid sm:grid-cols-3 gap-2 text-xs">
                      <label class="flex items-center gap-2"><input type="checkbox" name="requires_admin_check" ${c.requires_admin_check ? 'checked' : ''} /> Admin check</label>
                      <select name="join_mode" class="px-2 py-1 rounded-lg border border-slate-200">
                        <option value="instant" ${c.join_mode === 'instant' ? 'selected' : ''}>Instant Join</option>
                        <option value="request" ${c.join_mode === 'request' ? 'selected' : ''}>Request to Join</option>
                      </select>
                      <select name="coordinator_id" class="px-2 py-1 rounded-lg border border-slate-200">
                        <option value="u_faculty" selected>Prof. Ananya Rao</option>
                      </select>
                      <input type="hidden" name="rep_id" value="${escapeHtml(c.rep_id)}" />
                    </div>
                  </form>
                `).join('')}
              </div>

              <div class="lg:col-span-5 tw-card p-6 space-y-4">
                <h2 class="text-lg font-bold text-slate-900">Auditorium & Venue Slots</h2>
                <div class="space-y-2 pb-4 border-b border-slate-100">
                  ${(d.venueSlots || []).map(v => `
                    <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-between gap-2 text-xs">
                      <div><strong>${escapeHtml(v.venue_name)}</strong><p class="text-[11px] text-slate-500">${escapeHtml(v.slot_time)}</p></div>
                      <button onclick="toggleVenue('${v.id}')" class="pill ${v.status === 'Available' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-800'}">${escapeHtml(v.status)}</button>
                    </div>
                  `).join('')}
                </div>
                <h2 class="text-lg font-bold text-slate-900">Canonical Tag List</h2>
                <form onsubmit="adminAddTag(event)" class="flex gap-2">
                  <input name="name" required placeholder="New tag e.g. Cloud" class="flex-1 px-3 py-2 rounded-xl border border-slate-200 text-xs" />
                  <input type="hidden" name="color" value="indigo" />
                  <button type="submit" class="btn-primary px-3.5 py-2 text-xs">Add Tag</button>
                </form>
                <div class="flex flex-wrap gap-2">
                  ${d.tags.map(t => `
                    <button onclick="adminToggleTag('${t.id}')" class="pill ${t.active ? 'bg-teal-50 text-teal-700 border border-teal-200' : 'bg-slate-100 text-slate-400 line-through'}">
                      #${escapeHtml(t.name)}
                    </button>
                  `).join('')}
                </div>
              </div>
            </div>
          </main>
        `;
      }

      // Automation, Outbox & Audit Log
      return `
        <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <h1 class="text-2xl font-bold text-slate-900">Automation, Outbox & Audit Log</h1>
            <div class="flex gap-2">
              <button onclick="state.adminAutoTab='reminders';render()" class="nav-pill ${state.adminAutoTab === 'reminders' ? 'active' : ''}">Reminder Queue (${d.reminders.length})</button>
              <button onclick="state.adminAutoTab='outbox';render()" class="nav-pill ${state.adminAutoTab === 'outbox' ? 'active' : ''}">Outbox (${d.outbox.length})</button>
              <button onclick="state.adminAutoTab='audit';render()" class="nav-pill ${state.adminAutoTab === 'audit' ? 'active' : ''}">Audit Log (${d.auditLog.length})</button>
            </div>
          </div>

          <div class="tw-card p-6 overflow-x-auto">
            ${state.adminAutoTab === 'reminders' ? `
              <table class="w-full text-left text-xs">
                <thead><tr class="border-b border-slate-200 text-slate-500"><th class="py-2">Event</th><th>Offset</th><th>Status</th><th>Action</th></tr></thead>
                <tbody>
                  ${d.reminders.map(r => `
                    <tr class="border-b border-slate-100">
                      <td class="py-2.5 font-semibold text-slate-900">${escapeHtml(r.event_title)}</td>
                      <td>${escapeHtml(r.offset_label)}</td>
                      <td><span class="pill ${r.status === 'Sent' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}">${escapeHtml(r.status)}</span></td>
                      <td>${r.status !== 'Sent' ? `<button onclick="simulateReminder('${r.id}')" class="text-teal-600 font-semibold">Simulate Send</button>` : 'Done'}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            ` : state.adminAutoTab === 'outbox' ? `
              <table class="w-full text-left text-xs">
                <thead><tr class="border-b border-slate-200 text-slate-500"><th class="py-2">Channel</th><th>Recipient</th><th>Subject</th><th>Message</th><th>Time</th></tr></thead>
                <tbody>
                  ${d.outbox.map(o => `
                    <tr class="border-b border-slate-100">
                      <td class="py-2.5"><span class="pill bg-teal-50 text-teal-700">${escapeHtml(o.channel)}</span></td>
                      <td>${escapeHtml(o.recipient)}</td>
                      <td class="font-semibold">${escapeHtml(o.subject)}</td>
                      <td class="text-slate-600">${escapeHtml(o.body)}</td>
                      <td class="text-slate-400">${escapeHtml(o.created_at)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            ` : `
              <table class="w-full text-left text-xs">
                <thead><tr class="border-b border-slate-200 text-slate-500"><th class="py-2">Actor</th><th>Action</th><th>Target</th><th>Comment</th><th>Time</th></tr></thead>
                <tbody>
                  ${d.auditLog.map(a => `
                    <tr class="border-b border-slate-100">
                      <td class="py-2.5 font-semibold">${escapeHtml(a.actor_name)} (${escapeHtml(a.actor_role)})</td>
                      <td><span class="pill bg-slate-100 text-slate-700">${escapeHtml(a.action)}</span></td>
                      <td>${escapeHtml(a.target_title)}</td>
                      <td class="text-slate-600">${escapeHtml(a.comment)}</td>
                      <td class="text-slate-400">${escapeHtml(a.created_at)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            `}
          </div>
        </main>
      `;
    }

    function renderNotifications() {
      const notifs = state.data.notifications;
      return `
        <main class="max-w-3xl mx-auto px-4 sm:px-6 py-8 space-y-4">
          <div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold text-slate-900">Notifications</h1>
            <button onclick="markAllRead()" class="btn-secondary px-3.5 py-1.5 text-xs">Mark all read</button>
          </div>
          <div class="tw-card p-5 space-y-3">
            ${notifs.length ? notifs.map(n => `
              <div class="p-3.5 rounded-xl border ${n.read ? 'bg-white border-slate-100' : 'bg-teal-50/50 border-teal-200'} text-xs">
                <div class="flex items-center justify-between font-bold text-slate-900"><span>${escapeHtml(n.title)}</span><span class="text-slate-400 font-normal">${escapeHtml(n.created_at)}</span></div>
                <p class="text-slate-600 mt-1">${escapeHtml(n.body)}</p>
              </div>
            `).join('') : `<p class="text-sm text-slate-500">All caught up!</p>`}
          </div>
        </main>
      `;
    }

    function render() {
      const root = document.getElementById('app');
      if (!state.data) {
        root.innerHTML = `<div class="p-12 text-center text-sm text-slate-500">Loading UniSync...</div>`;
        return;
      }
      let body = '';
      if (!state.userId && state.view !== 'login') {
        body = renderLanding();
      } else if (state.view === 'landing') {
        body = renderLanding();
      } else if (state.view === 'login') {
        body = renderLogin();
      } else if (state.view === 'onboarding' || state.view === 'settings') {
        body = renderOnboarding();
      } else if (state.view === 'home') {
        body = renderHome();
      } else if (state.view === 'explore') {
        body = renderExplore();
      } else if (state.view === 'event-detail') {
        body = renderEventDetail();
      } else if (state.view === 'deadlines') {
        body = renderDeadlines();
      } else if (state.view === 'schedule') {
        body = renderScheduleAndCabins();
      } else if (state.view === 'map') {
        body = renderMap();
      } else if (state.view === 'communities') {
        body = renderCommunities();
      } else if (state.view === 'inbox') {
        body = renderInbox();
      } else if (state.view === 'club-management') {
        body = renderClubManagement();
      } else if (state.view === 'faculty-publish' || state.view === 'club-approvals') {
        body = renderFacultyViews();
      } else if (state.view.startsWith('admin-')) {
        body = renderAdminViews();
      } else if (state.view === 'notifications') {
        body = renderNotifications();
      } else {
        body = renderHome();
      }
      root.innerHTML = renderHeader() + body;
    }

    // Boot
    refreshData();
  </script>
</body>
</html>
